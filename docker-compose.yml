services:
  web:
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:-mysql://spearhead:spearhead@db:3306/spearhead_command_portal}
      FILE_STORAGE_ROOT: /app/storage
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - uploads:/app/storage

  gateway:
    build:
      context: .
      target: worker
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:-mysql://spearhead:spearhead@db:3306/spearhead_command_portal}
      DISCORD_GATEWAY_ENABLED: ${DISCORD_GATEWAY_ENABLED:-false}
      FILE_STORAGE_ROOT: /app/storage
      NODE_ENV: production
    profiles:
      - gateway
    restart: unless-stopped
    volumes:
      - uploads:/app/storage

  migrate:
    build:
      context: .
      target: worker
    command: npm run db:migrate:deploy
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://spearhead:spearhead@db:3306/spearhead_command_portal}
      NODE_ENV: production
    profiles:
      - tools

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-spearhead_command_portal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-spearhead}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-spearhead-root}
      MARIADB_USER: ${MARIADB_USER:-spearhead}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
  uploads:
